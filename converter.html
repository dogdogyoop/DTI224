<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Measurement Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>

<body class="calculator-page">

<a class="page-back" href="index.html">Back</a>

<main class="card">

    <h1>Measurement Converter Inches to Centimeters</h1>

    <div class="form-row">
        <label for="inch">Enter inches:</label>
        <input type="number" id="inch">
    </div>

    <div class="actions">
        <button onclick="convert()">Submit</button>
    </div>

    <h2 class="result" id="result"></h2>

</main>

<script src="pwa.js"></script>

<script>

function convert()
{
    let inch = document.getElementById("inch").value;

    // Validation
    if(inch == "")
    {
        alert("Please enter a value.");
        return;
    }

    if(inch < 0)
    {
        alert("Please enter a positive number.");
        return;
    }

    let cm = inch * 2.54;

    document.getElementById("result").innerHTML =
    "Equal to " + cm + " cm";
}

function goBack()
{
    history.back();
}

</script>

</body>
</html>
