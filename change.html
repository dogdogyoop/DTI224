<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="calculator-page">

<main class="card">

    <h1>Change Calculator</h1>

    <div class="form-row">
        <label for="amountInput">Enter your amount:</label>
        <input id="amountInput" type="number">
    </div>

    <div class="actions">
        <button onclick="calculateChange()">Calculate</button>
        <button onclick="goBack()">Back</button>
    </div>

    <div id="change-results"></div>

</main>

<script>

function calculateChange()
{
    let amount = parseFloat(document.getElementById("amountInput").value);

    // Validation
    if(isNaN(amount))
    {
        alert("Please enter an amount.");
        return;
    }

    if(amount <= 0)
    {
        alert("Please enter a positive number.");
        return;
    }

    let denominations = [1000,500,100,50,20,10,5,2,1,0.5];

    let result = "";

    for(let i = 0; i < denominations.length; i++)
    {
        let count = Math.floor(amount / denominations[i]);

        if(count > 0)
        {
            result += "<p>" + denominations[i] + " Baht : " + count + "</p>";
            amount %= denominations[i];
        }
    }

    document.getElementById("change-results").innerHTML = result;
}

function goBack()
{
    history.back();
}

</script>

</body>
</html>
